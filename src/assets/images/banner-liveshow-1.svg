<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Live Show Lập Trình Frontend">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071936"/>
      <stop offset="55%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#0dcaf0"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" rx="20" fill="url(#bg1)"/>
  <circle cx="550" cy="70" r="95" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="90" cy="320" r="110" fill="#0dcaf0" fill-opacity="0.12"/>
  <!-- Khung trình duyệt Live Coding -->
  <rect x="40" y="36" width="560" height="308" rx="16" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="40" y="36" width="560" height="38" rx="16" fill="#0f172a"/>
  <circle cx="66" cy="55" r="6" fill="#ef4444"/>
  <circle cx="86" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="106" cy="55" r="6" fill="#10b981"/>
  <rect x="140" y="45" width="260" height="20" rx="6" fill="#1e293b"/>
  <text x="155" y="59" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">https://educourses.vn/live-workshop</text>
  <!-- Huy hiệu LIVE -->
  <rect x="495" y="44" width="85" height="22" rx="11" fill="#dc3545"/>
  <circle cx="511" cy="55" r="4" fill="#ffffff"/>
  <text x="522" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">LIVE SHOW</text>
